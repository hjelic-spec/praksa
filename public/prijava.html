<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava – Preglednik sudske prakse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="narrow">
    <h1>Preglednik sudske prakse</h1>

    <form id="prijava" class="card" hidden>
      <h2>Prijava</h2>
      <label for="p-korisnik">Korisničko ime</label>
      <input id="p-korisnik" autocomplete="username" required>
      <label for="p-lozinka">Lozinka</label>
      <input id="p-lozinka" type="password" autocomplete="current-password" required>
      <button type="submit">Prijavi se</button>
    </form>

    <form id="postavljanje" class="card" hidden>
      <h2>Prvo pokretanje</h2>
      <p class="meta">Postavite korisničko ime i lozinku za ulaz u aplikaciju. Ako zaboravite lozinku, vidi upute u README-u (obrisati datoteku prijava.json).</p>
      <label for="s-korisnik">Korisničko ime</label>
      <input id="s-korisnik" autocomplete="username" required minlength="3">
      <label for="s-lozinka">Lozinka <span class="meta">(barem 8 znakova)</span></label>
      <input id="s-lozinka" type="password" autocomplete="new-password" required minlength="8">
      <label for="s-lozinka2">Ponovite lozinku</label>
      <input id="s-lozinka2" type="password" autocomplete="new-password" required minlength="8">
      <label for="s-kljuc">Anthropic API ključ <span class="meta">(počinje sa sk-ant-; može i kasnije u Postavkama)</span></label>
      <input id="s-kljuc" type="password" autocomplete="off" placeholder="sk-ant-…">
      <button type="submit">Spremi i uđi</button>
    </form>

    <p id="poruka" class="greska" hidden></p>
  </main>
  <script src="prijava.js"></script>
</body>
</html>
